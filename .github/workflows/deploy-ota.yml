name: Build & Deploy OTA

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build release firmware
        run: pio run -e gh_release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        working-directory: tools/ota-worker
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' if present (e.g., v1.3.0 -> 1.3.0)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get firmware size
        id: firmware
        run: |
          SIZE=$(stat -c%s .pio/build/gh_release/firmware.bin)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload firmware.bin to R2
        working-directory: tools/ota-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "crosspoint-firmware/firmware.bin" \
            --file="../../.pio/build/gh_release/firmware.bin" \
            --content-type="application/octet-stream"

      - name: Upload version.json to R2
        working-directory: tools/ota-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo '{"version": "${{ steps.version.outputs.tag }}", "size": ${{ steps.firmware.outputs.size }}}' > /tmp/version.json
          npx wrangler r2 object put "crosspoint-firmware/version.json" \
            --file="/tmp/version.json" \
            --content-type="application/json"

      - name: Deploy Worker
        working-directory: tools/ota-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-OTA-${{ github.ref_name }}
          path: .pio/build/gh_release/firmware.bin
