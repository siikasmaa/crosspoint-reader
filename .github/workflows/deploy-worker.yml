name: Deploy OTA Worker

# Redeploys only the Cloudflare Worker (no firmware build / R2 upload) when the
# worker sources change, or on demand. Firmware uploads happen in ci.yml.

on:
  push:
    branches: [customisation]
    paths:
      - 'tools/ota-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ota
      cancel-in-progress: false
    environment:
      name: ota-worker
      url: ${{ vars.OTA_SERVER_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/ota-worker
        run: npm ci

      - name: Deploy Worker
        working-directory: tools/ota-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OTA_ROUTE_PATTERN: ${{ vars.OTA_ROUTE_PATTERN }}
        run: npm run deploy
