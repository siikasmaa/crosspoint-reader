name = "crosspoint-ota"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Account, API token and an optional custom-domain route are NOT stored here.
# They come from the environment (or a .env file) and are applied by deploy.mjs:
#   CLOUDFLARE_ACCOUNT_ID   your Cloudflare account id
#   CLOUDFLARE_API_TOKEN    API token with Workers + R2 permissions
#   OTA_ROUTE_PATTERN       optional, e.g. "ota.example.com/*" (zone must be on the account)
# Without OTA_ROUTE_PATTERN the worker is served from its *.workers.dev URL.

# R2 bucket binding for firmware storage
[[r2_buckets]]
binding = "FIRMWARE_BUCKET"
bucket_name = "crosspoint-firmware"

[vars]
# Fallback version if version.json is missing from the bucket
FIRMWARE_VERSION = "1.2.0"
